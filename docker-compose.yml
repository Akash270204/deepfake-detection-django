services:
  web:
    build: .
    image: deepfake-detector:latest
    container_name: deepfake_web
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Persist user uploads and database between restarts
      - media_data:/app/media
      - db_data:/app/db.sqlite3
      - log_data:/app/logs
    environment:
      - DJANGO_SETTINGS_MODULE=deepfake_detection.settings
      - PYTHONUNBUFFERED=1
      # Override in production — never commit real secrets
      - SECRET_KEY=${SECRET_KEY:-django-insecure-change-me-in-production}
      - DEBUG=${DEBUG:-False}
      # TF: disable GPU ops that won't be available on most AWS instances
      - CUDA_VISIBLE_DEVICES=-1
      - TF_CPP_MIN_LOG_LEVEL=2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  media_data:
  db_data:
  log_data:
